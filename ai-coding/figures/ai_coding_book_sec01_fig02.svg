<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>
<rect width="1200" height="800" fill="#FAF7F0"/>
<text x="80" y="70" font-size="32" fill="#0F4C81" text-anchor="start" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>上下文窗口:标称值 vs 有效值 vs 计费触发点</text>
<line x1="80" y1="130" x2="1120" y2="130" stroke="#D8D2C5" stroke-width="1"/>
<rect x="100" y="170" width="480.0" height="60" fill="#0F4C81" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
<text x="340.0" y="208" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>标称 vs 有效</text>
<rect x="620.0" y="170" width="480.0" height="60" fill="#16A085" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
<text x="860.0" y="208" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>计费触发点</text>
<line x1="600.0" y1="170" x2="600.0" y2="670" stroke="#D8D2C5" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="100" y="250.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="278.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 标称 1M 上下文:理论值</text>
<rect x="620.0" y="250.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="278.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 输入 Token 计费起点</text>
<rect x="100" y="352.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="380.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 有效 200K:实际可用(订阅)</text>
<rect x="620.0" y="352.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="380.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 缓存命中不计费(Kimi 优势)</text>
<rect x="100" y="455.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="483.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 超出 200K 自动压缩摘要</text>
<rect x="620.0" y="455.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="483.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 输出按 5× 价计</text>
<rect x="100" y="557.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="585.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 细节随压缩丢失</text>
<rect x="620.0" y="557.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="585.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 5h 滚动 + 周上限双池</text>
<line x1="80" y1="730" x2="1120" y2="730" stroke="#D8D2C5" stroke-width="1"/>
<text x="1120" y="755" font-size="12" fill="#8B8680" text-anchor="end" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>施可 · 三本书</text>
