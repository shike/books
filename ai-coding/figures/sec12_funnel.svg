<text x="600.0" y="228.5" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>30 条需求</text>
<text x="600.0" y="250.5" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>客户原始诉求</text>
<polygon points="225.0,295.0 975.0,295.0 870.0,410.0 330.0,410.0" fill="#16A085" stroke="#2D2D2D" stroke-width="1.5"/>
<text x="600.0" y="353.5" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>5 个目标</text>
<text x="600.0" y="375.5" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>Demo 介导收敛</text>
<polygon points="330.0,420.0 870.0,420.0 765.0,535.0 435.0,535.0" fill="#16A085" stroke="#2D2D2D" stroke-width="1.5"/>
<text x="600.0" y="478.5" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>4 周交付</text>
<text x="600.0" y="500.5" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>MVP + 迭代</text>
<polygon points="435.0,545.0 765.0,545.0 660.0,660.0 540.0,660.0" fill="#D2691E" stroke="#2D2D2D" stroke-width="1.5"/>
<text x="600.0" y="603.5" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>1 个上线</text>
<text x="600.0" y="625.5" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>完整可验收</text>
<line x1="80" y1="730" x2="1120" y2="730" stroke="#D8D2C5" stroke-width="1"/>
<text x="1120" y="755" font-size="12" fill="#8B8680" text-anchor="end" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>施可 · 三本书</text>
