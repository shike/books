<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>
<rect width="1200" height="800" fill="#FAF7F0"/>
<text x="80" y="70" font-size="32" fill="#0F4C81" text-anchor="start" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>视觉差异比对:截图 vs 实际渲染</text>
<line x1="80" y1="130" x2="1120" y2="130" stroke="#D8D2C5" stroke-width="1"/>
<rect x="100" y="170" width="480.0" height="60" fill="#0F4C81" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
<text x="340.0" y="208" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>原始截图</text>
<rect x="620.0" y="170" width="480.0" height="60" fill="#D2691E" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
<text x="860.0" y="208" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>复刻渲染</text>
<line x1="600.0" y1="170" x2="600.0" y2="670" stroke="#D8D2C5" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="100" y="250.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="278.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 1080p 截图</text>
<rect x="620.0" y="250.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="278.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• Flex/Grid 布局推算</text>
<rect x="100" y="332.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="360.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 字体系统默认</text>
<rect x="620.0" y="332.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="360.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 字体替代(Fallback)</text>
<rect x="100" y="414.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="442.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 颜色取色器采得</text>
<rect x="620.0" y="414.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="442.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 色值有 ±3 偏差</text>
<rect x="100" y="496.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="524.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 间距肉眼测量</text>
<rect x="620.0" y="496.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="524.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 间距用规范值</text>
<rect x="100" y="578.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="606.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 动效无法捕获</text>
<rect x="620.0" y="578.0" width="480.0" height="70.0" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="606.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 动效用 CSS 估算</text>
<line x1="80" y1="730" x2="1120" y2="730" stroke="#D8D2C5" stroke-width="1"/>
<text x="1120" y="755" font-size="12" fill="#8B8680" text-anchor="end" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>施可 · 三本书</text>
</svg>
