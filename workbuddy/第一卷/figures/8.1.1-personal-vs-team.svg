<line x1="600.0" y1="170" x2="600.0" y2="670" stroke="#D8D2C5" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="100" y="250.0" width="480.0" height="124.66666666666666" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
