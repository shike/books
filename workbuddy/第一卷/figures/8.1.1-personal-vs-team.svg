<text x="120" y="551.3333333333333" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 仍是个人贡献</text>
<rect x="620.0" y="523.3333333333333" width="480.0" height="124.66666666666666" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="551.3333333333333" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 沉淀团队资产</text>
