<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>
<rect width="1200" height="800" fill="#FAF7F0"/>
<text x="80" y="70" font-size="32" fill="#0F4C81" text-anchor="start" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>单模型 AI vs 多模型路由</text>
<line x1="80" y1="130" x2="1120" y2="130" stroke="#D8D2C5" stroke-width="1"/>
<rect x="100" y="170" width="480.0" height="60" fill="#D2691E" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
<text x="340.0" y="208" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>单模型(网页版)</text>
<rect x="620.0" y="170" width="480.0" height="60" fill="#16A085" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
<text x="860.0" y="208" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>多模型路由</text>
<line x1="600.0" y1="170" x2="600.0" y2="670" stroke="#D8D2C5" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="100" y="250.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="278.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 所有任务跑同一个模型</text>
<rect x="620.0" y="250.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="278.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 按任务自动选</text>
<rect x="100" y="352.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="380.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• DeepSeek 强项不在中文写作</text>
<rect x="620.0" y="352.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="380.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 周报 → 智谱</text>
<rect x="100" y="455.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="483.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 周报可能不佳</text>
<rect x="620.0" y="455.0" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="483.0" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• PDF 摘要 → Kimi</text>
<rect x="100" y="557.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="120" y="585.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 你自己挑模型</text>
<rect x="620.0" y="557.5" width="480.0" height="90.5" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.5" rx="6"/>
<text x="640.0" y="585.5" font-size="15" fill="#2D2D2D" text-anchor="start" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>• 你只提需求</text>
<line x1="80" y1="730" x2="1120" y2="730" stroke="#D8D2C5" stroke-width="1"/>
<text x="1120" y="755" font-size="12" fill="#8B8680" text-anchor="end" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'>施可 · 三本书</text>
</svg>
