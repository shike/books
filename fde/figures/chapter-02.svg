<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="white" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="500" /><line x1="40" y1="0" x2="40" y2="500" /><line x1="80" y1="0" x2="80" y2="500" /><line x1="120" y1="0" x2="120" y2="500" /><line x1="160" y1="0" x2="160" y2="500" /><line x1="200" y1="0" x2="200" y2="500" /><line x1="240" y1="0" x2="240" y2="500" /><line x1="280" y1="0" x2="280" y2="500" /><line x1="320" y1="0" x2="320" y2="500" /><line x1="360" y1="0" x2="360" y2="500" /><line x1="400" y1="0" x2="400" y2="500" /><line x1="440" y1="0" x2="440" y2="500" /><line x1="480" y1="0" x2="480" y2="500" /><line x1="520" y1="0" x2="520" y2="500" /><line x1="560" y1="0" x2="560" y2="500" /><line x1="600" y1="0" x2="600" y2="500" /><line x1="640" y1="0" x2="640" y2="500" /><line x1="680" y1="0" x2="680" y2="500" /><line x1="720" y1="0" x2="720" y2="500" /><line x1="760" y1="0" x2="760" y2="500" /><line x1="800" y1="0" x2="800" y2="500" />
    <line x1="0" y1="0" x2="800" y2="0" /><line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" />
  </g>

  <!-- Accent dots decoration -->
  <g opacity="0.15" fill="#e94560">
    <circle cx="50" cy="50" r="2" />
    <circle cx="750" cy="50" r="2" />
    <circle cx="50" cy="450" r="2" />
    <circle cx="750" cy="450" r="2" />
    <circle cx="400" cy="30" r="1.5" />
    <circle cx="400" cy="470" r="1.5" />
  </g>

  <!-- Part label -->
  <text x="400" y="95" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="11" fill="#e94560" opacity="0.7"
        letter-spacing="6" font-weight="600">第一篇：认知</text>

  <!-- Chapter number -->
  <text x="400" y="155" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="14" fill="#e94560" opacity="0.8"
        letter-spacing="3" font-weight="400">第 2 章</text>

  <!-- Accent line -->
  <rect x="250" y="175" width="300" height="2" rx="1" fill="url(#accentLine)" opacity="0.6" />

  <!-- Chapter title -->
  <text x="400" y="245" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="40" fill="white" opacity="0.95"
        letter-spacing="2" font-weight="700">PoC 地狱</text>

  <!-- Book title at bottom -->
  <text x="400" y="380" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="13" fill="white" opacity="0.35"
        letter-spacing="3" font-weight="400">FDE：AI 的胜负不在模型</text>

  <!-- Bottom accent line -->
  <rect x="300" y="410" width="200" height="1" rx="0.5" fill="url(#accentLine)" opacity="0.3" />
</svg>